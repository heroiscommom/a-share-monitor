name: Sentiment Scan

on:
  schedule:
    # 每天 16:10 北京时间（收盘后）扫描舆情并按热度推送 TOP5
    - cron: '10 8 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sentiment
  cancel-in-progress: true

jobs:
  sentiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run sentiment scan
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python3 -m sentiment.runner

      - name: Commit sentiment data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sentiment/
          git commit -m "chore: 舆情数据 $(date +'%Y-%m-%dT%H:%M:%S%z')" || echo "无变化"
          git pull --rebase origin main 2>/dev/null || true
          git push
