name: Weekly Review

on:
  schedule:
    - cron: '30 7 * * 0'   # 每周日 15:30 北京时间
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run weekly review
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: python3 weekly_review.py

      - name: Commit equity history
        uses: ./.github/actions/commit-data
        with:
          files: data/equity_history.json data/trades.json
          message: 'chore: 周复盘净值更新'
