name: Stock Scanner

on:
  schedule:
    - cron: '0 8 * * 1-5'   # 16:00 北京时间（收盘后），周一至周五
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run scanner
        run: python3 scanner.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scanner.json data/scanner_pool.json
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore: 更新扫描候选股"
            git pull --rebase origin main 2>/dev/null || true
            git push
          fi
