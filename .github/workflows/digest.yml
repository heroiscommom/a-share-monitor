name: Daily Digest

on:
  schedule:
    - cron: '30 7 * * 1-5'   # 15:30 北京时间（收盘后），周一至周五
  workflow_dispatch:
    inputs:
      demo:
        description: '发送演示邮件（测试分级格式）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send digest
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          if [ "${{ github.event.inputs.demo }}" = "true" ]; then
            python3 digest.py --demo
          else
            python3 picks.py
            python3 digest.py
          fi

      - name: Commit cleared digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/digest.json data/digest_sent_*.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore: 清空异动日报"
            # 并发提交 data/ 时 rebase/push 会失败：拉取后若有冲突，以本地(清空)为准
            git pull --rebase origin main 2>/dev/null || true
            git checkout --ours data/digest.json data/digest_sent_*.txt 2>/dev/null || true
            git add data/digest.json data/digest_sent_*.txt 2>/dev/null || true
            git -c core.editor=true rebase --continue 2>/dev/null || true
            git push || { sleep 5; git pull --rebase origin main 2>/dev/null || true; git push; } || echo "⚠️ push 失败，下次 run 重试"
          fi
