name: Pool Backtest

on:
  schedule:
    - cron: '0 6 * * 1'   # 每周一 06:00 UTC（14:00 北京时间）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run pool backtest
        run: python3 pool_backtest.py

      - name: Commit result
        uses: ./.github/actions/commit-data
        with:
          files: data/pool_backtest.json data/pool_list.json
          message: 'chore: 更新股票池回测结果'
