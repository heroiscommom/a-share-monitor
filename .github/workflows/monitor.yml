name: Stock Monitor

on:
  schedule:
    # A股交易时段（北京时间）：9:30-11:30、13:00-15:00，周一至周五
    # GitHub Actions 的 cron 用 UTC，需减 8 小时
    # 1-3 点 UTC = 9:00-11:59 北京；5-7 点 UTC = 13:00-15:59 北京
    - cron: '*/5 1-3,5-7 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run monitor
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WECOM_CORPID: ${{ secrets.WECOM_CORPID }}
          WECOM_SECRET: ${{ secrets.WECOM_SECRET }}
          WECOM_AGENTID: ${{ secrets.WECOM_AGENTID }}
        run: python monitor.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: 更新盯盘数据 $(date +'%Y-%m-%dT%H:%M:%S%z')" || echo "无数据变化，跳过提交"
          git push
