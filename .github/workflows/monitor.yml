name: Stock Monitor

on:
  schedule:
    # A股交易时段（北京时间）：9:30-11:30、13:00-15:00，周一至周五
    # GitHub Actions 的 cron 用 UTC，需减 8 小时
    - cron: '*/5 1-3,5-7 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run monitor (push enabled)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        # 推送机制 v2：S/A 信号逐条 Server酱微信实时推送；邮件只由收盘 digest 汇总
        # （Actions cron 为尽力而为调度，约5分钟一轮；如需秒级实时需常驻服务器）
        run: python monitor.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: 更新盯盘数据 $(date +'%Y-%m-%dT%H:%M:%S%z')" || echo "无数据变化，跳过提交"
          # 并发提交 data/ 时 rebase 可能冲突：以本地最新扫描数据为准（--ours）
          git pull --rebase origin main 2>/dev/null || true
          git checkout --ours data/ 2>/dev/null || true
          git add data/ 2>/dev/null || true
          git -c core.editor=true rebase --continue 2>/dev/null || true
          git push || { sleep 5; git pull --rebase origin main 2>/dev/null || true; git push; } || echo "⚠️ push 失败，下次 run 重试"
