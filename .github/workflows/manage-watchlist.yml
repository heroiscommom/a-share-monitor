name: Manage Watchlist

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update watchlist & refresh data
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: |
          python3 manage_watchlist.py | tee result.txt
          echo "--- 刷新行情数据 ---"
          python3 monitor.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.json data/
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore: 更新自选股及数据 (issue #${{ github.event.issue.number }})"
            git pull --rebase origin main 2>/dev/null || true
            git push
          fi

      - name: Comment on issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULT="$(cat result.txt 2>/dev/null || echo '处理失败，请重试')"
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$RESULT"

      - name: Close issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
