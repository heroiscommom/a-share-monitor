name: Trade Command

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  trade:
    if: contains(github.event.issue.title, '[trade]') || contains(github.event.issue.body, '/trade')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute trade command
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 trade_command.py | tee result.txt

      - name: Commit trades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trades.json
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore: 交易流水更新 (issue #${{ github.event.issue.number }})"
            git pull --rebase origin main 2>/dev/null || true
            git push
          fi

      - name: Comment on issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULT="$(cat result.txt 2>/dev/null || echo '处理失败，请重试')"
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$RESULT"

      - name: Close issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
