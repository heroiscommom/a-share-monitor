name: Trade Command

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  trade:
    if: contains(github.event.issue.title, '[trade]') || contains(github.event.issue.body, '/trade')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Execute trade command
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 trade_command.py | tee result.txt

      - name: Commit trades
        uses: ./.github/actions/commit-data
        with:
          files: data/trades.json
          message: 'chore: 交易流水更新 (issue #${{ github.event.issue.number }})'

      - name: Comment on issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULT="$(cat result.txt 2>/dev/null || echo '处理失败，请重试')"
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$RESULT"

      - name: Close issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
