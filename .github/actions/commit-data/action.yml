name: Commit and push data
description: >-
  统一「提交数据变更 + 并发容错推送」样板（2026-08 重构）。
  替代各 workflow 里重复的 git config/add/commit/pull --rebase/push 步骤。
  并发提交 data/ 冲突时以本地最新为准（--ours），保证 push 不被其他 run 阻塞。

inputs:
  files:
    description: '要 git add 的路径（空格分隔），默认 data/'
    required: false
    default: 'data/'
  message:
    description: '提交信息前缀（自动追加时间戳）'
    required: false
    default: 'chore: 更新数据'

runs:
  using: composite
  steps:
    - name: Commit and push
      shell: bash
      run: |
        set -e
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add ${{ inputs.files }} 2>/dev/null || true
        if git diff --cached --quiet; then
          echo "无变更，跳过提交"
          exit 0
        fi
        git commit -m "${{ inputs.message }} $(date +'%Y-%m-%dT%H:%M:%S%z')" || true
        # 并发提交 data/ 时 rebase 可能冲突：以本地最新扫描数据为准（--ours）
        git pull --rebase origin main 2>/dev/null || true
        git checkout --ours ${{ inputs.files }} 2>/dev/null || true
        git add ${{ inputs.files }} 2>/dev/null || true
        git -c core.editor=true rebase --continue 2>/dev/null || true
        git push || { sleep 5; git pull --rebase origin main 2>/dev/null || true; git push; } || echo "推送失败(下次 run 会再尝试)"
