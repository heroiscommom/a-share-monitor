<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A股盯盘助手</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
  <header>
    <div class="title">📈 A股盯盘助手</div>
    <div id="updated" class="updated">加载中…</div>
  </header>

  <main>
    <section class="panel">
      <h2>自选股</h2>
      <table id="watchlist">
        <thead>
          <tr><th>代码</th><th>名称</th><th>最新价</th><th>涨跌幅</th><th>成交量(手)</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="panel">
      <h2 id="chart-title">走势</h2>
      <div id="chart"></div>
    </section>

    <section class="panel">
      <h2>异动记录</h2>
      <ul id="alerts"></ul>
    </section>
  </main>

  <footer>数据来源：东方财富 · 仅供参考，不构成投资建议</footer>

  <script src="app.js"></script>
</body>
</html>
