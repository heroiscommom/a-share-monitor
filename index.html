<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A股盯盘助手</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
  <header>
    <div class="title">📈 A股盯盘助手</div>
    <div class="header-right">
      <button id="manage-btn">⚙️ 管理自选股</button>
      <div id="updated" class="updated">加载中…</div>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>自选股</h2>
      <table id="watchlist">
        <thead>
          <tr><th>代码</th><th>名称</th><th>最新价</th><th>涨跌幅</th><th>评分</th><th>信号</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="panel">
      <div class="chart-head">
        <h2 id="chart-title">走势</h2>
        <div class="chart-toggle">
          <button id="btn-intraday" class="active">分时</button>
          <button id="btn-daily">日K</button>
        </div>
      </div>
      <div id="chart"></div>
    </section>

    <section class="panel full">
      <div class="chart-head">
        <h2 id="factor-title">量化因子</h2>
        <div id="factor-score" class="factor-score"></div>
      </div>
      <div id="factor-radar" class="factor-radar"></div>
      <div id="fundamental-bar" class="fundamental-bar"></div>
    </section>

    <section class="panel full">
      <div class="chart-head">
        <h2>回测报告</h2>
        <span id="backtest-meta" class="backtest-meta"></span>
      </div>
      <div class="backtest-box">
        <div id="backtest-chart"></div>
        <div id="backtest-conclusion" class="backtest-conclusion"></div>
      </div>
      <div class="chart-head" style="margin-top:14px;">
        <h2>超跌信号：胜率 vs 阈值</h2>
      </div>
      <div id="threshold-chart" class="threshold-chart"></div>
    </section>

    <section class="panel full">
      <div class="chart-head">
        <h2>板块趋势</h2>
        <span id="sector-meta" class="backtest-meta"></span>
      </div>
      <div id="sector-anomalies" class="sector-anomalies"></div>
      <div id="sector-list" class="sector-list"></div>
    </section>

    <section class="panel full">
      <div class="chart-head">
        <h2>扫描候选股</h2>
        <span id="scanner-meta" class="backtest-meta"></span>
      </div>
      <div id="scanner-list" class="scanner-list"></div>
    </section>

    <section class="panel full">
      <h2>异动记录</h2>
      <ul id="alerts"></ul>
    </section>
  </main>

  <footer>数据来源：腾讯行情 · 仅供参考，不构成投资建议</footer>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2>⚙️ 管理自选股</h2>
        <button id="modal-close" class="modal-x">✕</button>
      </div>
      <div class="modal-add">
        <input id="add-code" placeholder="输入6位股票代码，如 600036" maxlength="6" inputmode="numeric">
        <button id="add-btn">添加</button>
      </div>
      <p class="hint">点「添加/移除」会打开 GitHub 新建 Issue 页，点「Submit new issue」提交后自动生效，几秒后刷新本页即可看到。股票名称会自动识别，无需填写。</p>
      <ul id="manage-list"></ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
